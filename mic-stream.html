<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mic Stream</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --accent:#4f8cff; --accent2:#ff5c5c;
    --text:#e8eaed; --muted:#8a8f98; --border:#262a33;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); padding:20px; min-height:100vh;
  }
  h1{font-size:20px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:20px; line-height:1.5;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px; margin-bottom:16px;
  }
  .card h2{font-size:14px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
  label{font-size:13px; color:var(--muted); display:block; margin-bottom:6px;}
  input[type=text]{
    width:100%; background:#0d0f14; color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:10px; font-size:14px; margin-bottom:10px;
  }
  button{
    border:none; border-radius:10px; padding:14px 16px; font-size:14px; font-weight:600;
    cursor:pointer; width:100%; margin-top:8px;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-mic{
    background:var(--accent2); color:#fff; font-size:16px; padding:20px;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn-mic.on{background:#2ecc71;}
  .roles{display:flex; gap:8px;}
  .roles button{flex:1;}
  .status{
    display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin-top:10px;
  }
  .dot{width:9px; height:9px; border-radius:50%; background:#555; flex-shrink:0;}
  .dot.connected{background:#2ecc71;}
  .dot.connecting{background:#f5a623; animation:pulse 1s infinite;}
  .dot.error{background:#ff5c5c;}
  @keyframes pulse{50%{opacity:.3;}}
  .hidden{display:none;}
  audio{width:100%; margin-top:10px;}
  .hint{font-size:12px; color:var(--muted); line-height:1.5; margin-top:8px;}
  .badge{
    display:inline-block; background:#0d0f14; border:1px solid var(--border); border-radius:6px;
    padding:2px 8px; font-size:11px; color:var(--muted); margin-left:6px;
  }
  .log{
    background:#0a0c10; border:1px solid var(--border); border-radius:10px; padding:10px;
    font-family:monospace; font-size:11px; line-height:1.6; max-height:220px; overflow-y:auto;
    margin-top:12px; white-space:pre-wrap; word-break:break-word;
  }
  .log .l-err{color:#ff6b6b;}
  .log .l-ok{color:#4ee08a;}
  .log .l-info{color:#7aa2f7;}
  .log .l-warn{color:#f5a623;}
</style>
</head>
<body>

<h1>🎙️ Mic Stream</h1>
<div class="sub">Live mic audio from one Android device to another, over any networks. Only the sender needs microphone permission.</div>

<div class="card" id="setupCard">
  <h2>Room Code</h2>
  <label>Use the SAME code on both devices, exactly (case-sensitive, no extra spaces).</label>
  <input type="text" id="roomCode" value="guna-mic-room-7241">
  <div class="roles">
    <button class="btn-primary" onclick="startRole('sender')">📤 I'm the Sender (mic)</button>
    <button class="btn-primary" onclick="startRole('listener')">📥 I'm the Listener (speaker)</button>
  </div>
</div>

<!-- SENDER PANEL -->
<div id="senderPanel" class="card hidden">
  <h2>Sender <span class="badge" id="senderRoomBadge"></span></h2>
  <button class="btn-mic" id="micBtn" onclick="toggleMic()">🎤 Turn Mic ON</button>
  <div class="status"><span class="dot" id="senderDot"></span><span id="senderStatus">Starting up...</span></div>
  <div class="hint">Leave this page open on the sending phone.</div>
  <div class="log" id="senderLog"></div>
</div>

<!-- LISTENER PANEL -->
<div id="listenerPanel" class="card hidden">
  <h2>Listener <span class="badge" id="listenerRoomBadge"></span></h2>
  <audio id="remoteAudio" autoplay playsinline controls></audio>
  <button class="btn-primary" id="playBtn" onclick="forcePlay()">🔊 Tap to Enable Sound</button>
  <div class="status"><span class="dot" id="listenerDot"></span><span id="listenerStatus">Starting up...</span></div>
  <div class="hint">No microphone permission needed on this device.</div>
  <div class="log" id="listenerLog"></div>
</div>

<script>
const iceConfig = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
  ]
};

let peer = null;          // PeerJS used ONLY for signaling (data channel), not media
let dataConn = null;
let pc = null;            // raw RTCPeerConnection we control fully
let localStream = null;
let micEnabled = false;
let role = null;
let roomCode = '';
let logBoxId = null;
let reconnectTimer = null;

function log(msg, level){
  if(!logBoxId) return;
  const box = document.getElementById(logBoxId);
  if(!box) return;
  const div = document.createElement('div');
  if(level) div.className = 'l-' + level;
  div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function setStatus(who, text, state){
  document.getElementById(who + 'Status').textContent = text;
  const dot = document.getElementById(who + 'Dot');
  dot.className = 'dot';
  if(state) dot.classList.add(state);
}

function startRole(chosen){
  role = chosen;
  roomCode = document.getElementById('roomCode').value.trim();
  if(!roomCode){ alert('Enter a room code first.'); return; }
  document.getElementById('setupCard').classList.add('hidden');

  if(role === 'sender'){
    document.getElementById('senderPanel').classList.remove('hidden');
    document.getElementById('senderRoomBadge').textContent = roomCode;
    logBoxId = 'senderLog';
    startSender();
  }else{
    document.getElementById('listenerPanel').classList.remove('hidden');
    document.getElementById('listenerRoomBadge').textContent = roomCode;
    logBoxId = 'listenerLog';
    startListener();
  }
}

/* =======================  SENDER  ======================= */
async function startSender(){
  setStatus('sender', 'Requesting microphone...', 'connecting');
  log('Requesting mic permission...', 'info');
  try{
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    localStream.getAudioTracks().forEach(t => t.enabled = false);
    log('Mic permission granted.', 'ok');
  }catch(e){
    setStatus('sender', 'Microphone permission denied.', 'error');
    log('Mic permission FAILED: ' + e.message, 'err');
    return;
  }

  const myId = roomCode + '-sender';
  log('Registering as: ' + myId, 'info');
  peer = new Peer(myId, { config: iceConfig, debug: 1 });

  peer.on('open', id=>{
    setStatus('sender', 'Ready — waiting for listener...', 'connecting');
    log('Signaling online as "' + id + '".', 'ok');
  });

  peer.on('connection', conn=>{
    log('Listener signaling connected: ' + conn.peer, 'ok');
    dataConn = conn;
    conn.on('data', async data=>{
      if(data.type === 'offer'){
        log('Received offer from listener, building answer...', 'info');
        await handleOfferAsSender(data.sdp, conn);
      } else if(data.type === 'ice' && pc){
        try{ await pc.addIceCandidate(data.candidate); }catch(e){}
      }
    });
    conn.on('close', ()=>{
      log('Listener signaling closed.', 'warn');
      setStatus('sender', 'Listener disconnected. Waiting...', 'connecting');
    });
  });

  peer.on('disconnected', ()=>{
    log('Signaling disconnected, reconnecting...', 'warn');
    setTimeout(()=>{ if(peer && !peer.destroyed) peer.reconnect(); }, 1500);
  });

  peer.on('error', err=>{
    log('PEER ERROR: ' + err.type + ' — ' + err.message, 'err');
    if(err.type === 'unavailable-id'){
      setStatus('sender', 'Room code in use by another sender. Change it on both devices.', 'error');
    }
  });
}

async function handleOfferAsSender(sdp, conn){
  if(pc) { try{ pc.close(); }catch(e){} }
  pc = new RTCPeerConnection(iceConfig);

  // attach our mic track
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  pc.onicecandidate = e=>{
    if(e.candidate) conn.send({ type:'ice', candidate: e.candidate });
  };
  pc.oniceconnectionstatechange = ()=>{
    log('ICE state: ' + pc.iceConnectionState, 'info');
    if(pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed'){
      setStatus('sender', 'Listener connected ✓', 'connected');
    }
  };

  await pc.setRemoteDescription(new RTCSessionDescription(sdp));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  conn.send({ type:'answer', sdp: pc.localDescription });
  log('Answer sent, streaming mic.', 'ok');
}

function toggleMic(){
  if(!localStream) return;
  micEnabled = !micEnabled;
  localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
  const btn = document.getElementById('micBtn');
  if(micEnabled){
    btn.textContent = '🔴 Mic ON — Tap to Mute';
    btn.classList.add('on');
    log('Mic ON.', 'ok');
  }else{
    btn.textContent = '🎤 Turn Mic ON';
    btn.classList.remove('on');
    log('Mic muted.', 'info');
  }
}

/* =======================  LISTENER  ======================= */
function startListener(){
  setStatus('listener', 'Connecting to relay...', 'connecting');
  const myId = roomCode + '-listener-' + Math.floor(Math.random()*100000);
  log('Registering as: ' + myId, 'info');
  peer = new Peer(myId, { config: iceConfig, debug: 1 });

  peer.on('open', ()=>{
    log('Signaling online. Connecting to sender...', 'ok');
    connectToSender();
  });

  peer.on('disconnected', ()=>{
    log('Signaling disconnected, reconnecting...', 'warn');
    setTimeout(()=>{ if(peer && !peer.destroyed) peer.reconnect(); }, 1500);
  });

  peer.on('error', err=>{
    log('PEER ERROR: ' + err.type + ' — ' + err.message, 'err');
    setStatus('listener', 'Sender not available (' + err.type + '), retrying...', 'connecting');
    scheduleRetry();
  });
}

function scheduleRetry(){
  if(reconnectTimer) clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(connectToSender, 4000);
}

function connectToSender(){
  if(reconnectTimer) clearTimeout(reconnectTimer);
  const targetId = roomCode + '-sender';
  log('Opening signaling channel to ' + targetId + '...', 'info');

  const conn = peer.connect(targetId, { reliable: true });
  if(!conn){ scheduleRetry(); return; }
  dataConn = conn;

  conn.on('open', async ()=>{
    log('Signaling channel open. Creating receive-only offer...', 'ok');
    await createReceiveOnlyOffer(conn);
  });

  conn.on('data', async data=>{
    if(data.type === 'answer'){
      log('Answer received from sender.', 'ok');
      try{
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      }catch(e){ log('setRemoteDescription failed: ' + e.message, 'err'); }
    } else if(data.type === 'ice' && pc){
      try{ await pc.addIceCandidate(data.candidate); }catch(e){}
    }
  });

  conn.on('close', ()=>{
    log('Signaling channel closed. Retrying...', 'warn');
    setStatus('listener', 'Disconnected. Retrying...', 'connecting');
    scheduleRetry();
  });

  conn.on('error', e=>{
    log('Signaling error: ' + e, 'err');
    scheduleRetry();
  });
}

async function createReceiveOnlyOffer(conn){
  if(pc){ try{ pc.close(); }catch(e){} }
  pc = new RTCPeerConnection(iceConfig);

  // THE KEY PART: explicitly declare we want to RECEIVE audio.
  // No getUserMedia, no mic permission needed on this device.
  pc.addTransceiver('audio', { direction: 'recvonly' });

  pc.ontrack = e=>{
    log('Audio track received!', 'ok');
    const audioEl = document.getElementById('remoteAudio');
    audioEl.srcObject = e.streams[0];
    audioEl.play().catch(err=> log('Autoplay blocked — tap the sound button. ' + err.message, 'warn'));
    setStatus('listener', 'Connected — receiving audio ✓', 'connected');
  };

  pc.onicecandidate = e=>{
    if(e.candidate) conn.send({ type:'ice', candidate: e.candidate });
  };

  pc.oniceconnectionstatechange = ()=>{
    log('ICE state: ' + pc.iceConnectionState, 'info');
    if(pc.iceConnectionState === 'failed'){
      log('ICE failed, retrying whole connection...', 'err');
      scheduleRetry();
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  conn.send({ type:'offer', sdp: pc.localDescription });
  log('Receive-only offer sent to sender.', 'info');
}

function forcePlay(){
  const audioEl = document.getElementById('remoteAudio');
  audioEl.muted = false;
  audioEl.volume = 1.0;
  audioEl.play().then(()=>{
    log('Audio playback enabled.', 'ok');
    document.getElementById('playBtn').textContent = '🔊 Sound Enabled';
  }).catch(e=> log('Play failed: ' + e.message, 'err'));
}

document.body.addEventListener('click', ()=>{
  const audioEl = document.getElementById('remoteAudio');
  if(audioEl && audioEl.srcObject) audioEl.play().catch(()=>{});
}, { once: true });
</script>

</body>
</html>
